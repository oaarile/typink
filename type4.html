<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 튜터 타자연습 🎀</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding/d2coding.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'sans-serif'], mono: ['Nanum Gothic Coding', 'monospace'] },
                    colors: {
                        pink: { 50: '#FFF0F5', 100: '#FFE4E1', 200: '#FFC0CB', 300: '#FFB6C1', 400: '#FF8DA1', 500: '#FF69B4', 600: '#F05398', 700: '#D8387F' },
                        lavender: { 50: '#FAF5FF', 100: '#F3E8FF', 200: '#E9D5FF', 400: '#C084FC', 500: '#A855F7' }
                    },
                    boxShadow: { 'soft-pink': '0 10px 30px -5px rgba(255, 182, 193, 0.4)', 'inner-pink': 'inset 0 2px 8px 0 rgba(255, 182, 193, 0.3)' }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E1 40%, #F3E8FF 100%); background-attachment: fixed; font-family: 'Pretendard', sans-serif; }
        .sidebar { width: 350px; height: 100vh; position: fixed; right: 0; top: 0; background: rgba(255, 255, 255, 0.95); border-left: 1px solid #FFD1DC; padding: 20px; display: flex; flex-direction: column; z-index: 100; }
        .main-container { flex: 1; margin-right: 350px; padding: 20px; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 2px solid rgba(255, 255, 255, 0.9); }
        .char-box { display: inline-block; position: relative; border-radius: 4px; transition: background-color 0.1s ease; }
        .caret-pink { animation: pinkBlink 0.9s infinite; border-radius: 4px; box-shadow: 0 0 8px rgba(255, 105, 180, 0.6); }
        @keyframes pinkBlink { 0%, 100% { opacity: 1; background-color: #FF69B4; color: white; } 50% { opacity: 0.4; background-color: #FFB6C1; } }
    </style>
</head>
<body class="text-slate-700 min-h-screen">

    <!-- Decorative Background Elements -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
        <div class="absolute top-10 left-[8%] text-pink-300 text-3xl opacity-60 animate-float" style="animation-delay: 0s;">🌸</div>
        <div class="absolute top-28 right-[12%] text-pink-400 text-2xl opacity-70 animate-float" style="animation-delay: 1s;">✨</div>
        <div class="absolute bottom-20 left-[5%] text-pink-300 text-4xl opacity-50 animate-float" style="animation-delay: 2s;">💖</div>
        <div class="absolute bottom-32 right-[8%] text-pink-300 text-3xl opacity-60 animate-float" style="animation-delay: 1.5s;">🎀</div>
        <div class="absolute top-1/2 left-[2%] text-lavender-400 text-2xl opacity-40 animate-float" style="animation-delay: 0.5s;">☁️</div>
        <div class="absolute top-1/3 right-[3%] text-pink-300 text-2xl opacity-50 animate-float" style="animation-delay: 2.5s;">🌷</div>
    </div>

    <aside class="sidebar shadow-2xl">
        <h2 class="font-bold text-pink-600 mb-4"><i class="fa-solid fa-robot"></i> AI 튜터</h2>
        <div id="chat-messages" class="flex-1 overflow-y-auto mb-4 space-y-3">
            <div class="text-sm bg-pink-100 p-3 rounded-xl">질문하거나 내용을 정리해 달라고 해보세요!</div>
        </div>
        <textarea id="chat-input" class="w-full border p-2 rounded-lg text-sm mb-2" placeholder="질문 입력..."></textarea>
        <button onclick="sendMessage()" class="w-full bg-pink-500 text-white py-2 rounded-lg font-bold">질문 전송</button>
    </aside>

    <main class="main-container">
        <!-- Header Navigation (Legacy Integration) -->
        <header class="relative z-10 pt-6 pb-2 px-4 mb-6">
            <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 bg-white/80 backdrop-blur-md border-2 border-white rounded-3xl p-4 sm:px-6 shadow-soft-pink">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-gradient-to-tr from-pink-400 to-pink-300 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md shadow-pink-200 animate-heart">⌨️</div>
                    <div><h1 class="font-bold text-xl sm:text-2xl text-pink-600 tracking-tight">AI 튜터 타자연습</h1></div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-open-font-modal" class="w-9 h-9 rounded-2xl bg-pink-100 hover:bg-pink-200 text-pink-600 flex items-center justify-center transition-all"><i class="fa-solid fa-font"></i></button>
                    <button id="btn-open-history-modal" class="w-9 h-9 rounded-2xl bg-pink-100 hover:bg-pink-200 text-pink-600 flex items-center justify-center transition-all"><i class="fa-solid fa-clock-rotate-left"></i></button>
                    <button id="btn-open-category-modal" class="w-9 h-9 rounded-2xl bg-pink-100 hover:bg-pink-200 text-pink-600 flex items-center justify-center transition-all"><i class="fa-solid fa-folder-plus"></i></button>
                </div>
            </div>
        </header>
            <section class="glass-card rounded-3xl p-8 border-4 border-white">
                <div id="typing-display" class="min-h-[180px] text-lg leading-loose font-mono"></div>
                <textarea id="hidden-input" class="sr-only" spellcheck="false"></textarea>
            </section>
        </div>
    </main>

        <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-pink-950/30 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border-4 border-pink-200 transform scale-90 transition-all duration-300 text-center relative overflow-hidden" id="result-card">
            <div class="w-20 h-20 bg-gradient-to-tr from-pink-300 to-pink-400 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-3 shadow-lg shadow-pink-200 animate-bounce">🎉</div>
            <h2 class="text-2xl font-bold text-pink-600 mb-1">연습 완료!</h2>
            <div class="flex gap-2">
                <button id="btn-modal-next" class="flex-1 py-3.5 bg-gradient-to-r from-pink-400 to-pink-600 text-white font-bold rounded-2xl">다음 글로 이동</button>
            </div>
        </div>
    </div>

    <!-- Modals (History, Font, Categories) placeholder -->
    <div id="font-modal" class="fixed inset-0 hidden"></div>
    <div id="history-modal" class="fixed inset-0 hidden"></div>
    <div id="category-modal" class="fixed inset-0 hidden"></div>

    <script>
        // AI 통신
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const chatBox = document.getElementById('chat-messages');
            if(!input.value) return;
            chatBox.innerHTML += `<div class="text-right text-xs bg-blue-50 p-2 rounded">${input.value}</div>`;
            const userMsg = input.value;
            input.value = '';
            try {
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: userMsg })
                });
                const data = await response.json();
                chatBox.innerHTML += `<div class="text-xs bg-pink-50 p-2 rounded">${data.reply}</div>`;
                targetText = data.reply;
                renderDisplay();
            } catch(e) { chatBox.innerHTML += `<div class="text-xs text-red-500">서버 연결 오류</div>`; }
        }

        // 핵심 상태
        let targetText = "사이드바의 AI 튜터에게 질문을 보내 내용을 받아보세요!";
        let typedText = "";
        const typingDisplay = document.getElementById('typing-display');
        const hiddenInput = document.getElementById('hidden-input');

        // 통합 로직 (type3.html의 코어 기능)
        function renderDisplay() {
            let html = "";
            for (let i = 0; i < targetText.length; i++) {
                if (i < typedText.length) {
                    html += `<span class="char-box ${typedText[i] === targetText[i] ? 'text-pink-600' : 'text-rose-600'}">${targetText[i]}</span>`;
                } else if (i === typedText.length) {
                    html += `<span class="char-box caret-pink">${targetText[i]}</span>`;
                } else {
                    html += `<span class="char-box text-pink-300">${targetText[i]}</span>`;
                }
            }
            typingDisplay.innerHTML = html;
        }

        hiddenInput.addEventListener('input', (e) => {
            typedText = hiddenInput.value;
            renderDisplay();
        });

        document.body.addEventListener('click', () => hiddenInput.focus());

        // 초기 렌더링
        renderDisplay();
    </script>
</body>
</html>
