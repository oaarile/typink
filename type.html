<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타자연습 🎀</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard & Nanum Gothic Coding Fonts -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                        mono: ['Nanum Gothic Coding', 'monospace'],
                    },
                    colors: {
                        pink: {
                            20: '#FFF8FA',
                            50: '#FFF0F5',  
                            100: '#FFE4E1', 
                            200: '#FFC0CB', 
                            300: '#FFB6C1', 
                            400: '#FF8DA1',
                            500: '#FF69B4', 
                            600: '#F05398',
                            700: '#D8387F',
                        },
                        lavender: {
                            50: '#FAF5FF',
                            100: '#F3E8FF',
                            200: '#E9D5FF',
                            400: '#C084FC',
                            500: '#A855F7',
                        }
                    },
                    boxShadow: {
                        'soft-pink': '0 10px 30px -5px rgba(255, 182, 193, 0.4), 0 4px 12px -2px rgba(255, 105, 180, 0.15)',
                        'inner-pink': 'inset 0 2px 8px 0 rgba(255, 182, 193, 0.3)',
                        'glow': '0 0 18px rgba(255, 105, 180, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E1 40%, #F3E8FF 100%);
            background-attachment: fixed;
            font-family: 'Pretendard', sans-serif;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .animate-heart {
            animation: heartPulse 1.5s ease-in-out infinite;
        }

        @keyframes pinkBlink {
            0%, 100% { opacity: 1; background-color: #FF69B4; color: white; }
            50% { opacity: 0.4; background-color: #FFB6C1; color: white; }
        }
        .caret-pink {
            animation: pinkBlink 0.9s infinite;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(255, 105, 180, 0.6);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        .char-box {
            display: inline-block;
            position: relative;
            box-sizing: border-box;
            border-radius: 4px;
            transition: background-color 0.1s ease, color 0.1s ease;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFF0F5;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB6C1;
            border-radius: 10px;
            border: 2px solid #FFF0F5;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF69B4;
        }
    </style>
</head>
<body class="text-slate-700 font-sans min-h-screen flex flex-col justify-between selection:bg-pink-200 selection:text-pink-700 relative overflow-x-hidden">

    <!-- Decorative Background Elements -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
        <div class="absolute top-10 left-[8%] text-pink-300 text-3xl opacity-60 animate-float" style="animation-delay: 0s;">🌸</div>
        <div class="absolute top-28 right-[12%] text-pink-400 text-2xl opacity-70 animate-float" style="animation-delay: 1s;">✨</div>
        <div class="absolute bottom-20 left-[5%] text-pink-300 text-4xl opacity-50 animate-float" style="animation-delay: 2s;">💖</div>
        <div class="absolute bottom-32 right-[8%] text-pink-300 text-3xl opacity-60 animate-float" style="animation-delay: 1.5s;">🎀</div>
        <div class="absolute top-1/2 left-[2%] text-lavender-400 text-2xl opacity-40 animate-float" style="animation-delay: 0.5s;">☁️</div>
        <div class="absolute top-1/3 right-[3%] text-pink-300 text-2xl opacity-50 animate-float" style="animation-delay: 2.5s;">🌷</div>
    </div>

    <!-- Header Navigation -->
    <header class="relative z-10 pt-6 pb-2 px-4">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 bg-white/80 backdrop-blur-md border-2 border-white rounded-3xl p-4 sm:px-6 shadow-soft-pink">
            
            <!-- Logo Section -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-tr from-pink-400 to-pink-300 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md shadow-pink-200 animate-heart">
                    ⌨️
                </div>
                <div>
                    <h1 class="font-bold text-xl sm:text-2xl text-pink-600 tracking-tight">타자연습</h1>
                </div>
            </div>

            <!-- Header Stats & Settings -->
            <div class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm font-bold">
                <div class="bg-pink-50/90 border border-pink-200/80 px-3 py-1.5 rounded-2xl text-pink-600 flex items-center gap-1.5 shadow-sm">
                    <i class="fa-regular fa-clock text-pink-400"></i>
                    <span id="stat-time" class="font-mono text-base">00:00</span>
                </div>
                <div class="bg-pink-50/90 border border-pink-200/80 px-3 py-1.5 rounded-2xl text-pink-600 flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-bolt text-pink-500"></i>
                    <span id="stat-cpm" class="font-mono text-base">0 CPM</span>
                </div>
                <div class="bg-pink-50/90 border border-pink-200/80 px-3 py-1.5 rounded-2xl text-pink-600 flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-heart text-pink-400"></i>
                    <span id="stat-accuracy" class="font-mono text-base">100%</span>
                </div>

                <button id="btn-open-category-modal" title="카테고리 관리" class="px-3 py-1.5 rounded-2xl bg-pink-100 hover:bg-pink-200 text-pink-600 transition-all border border-pink-200 flex items-center gap-1 text-xs">
                    <i class="fa-solid fa-folder-plus"></i>
                    <span class="hidden sm:inline">카테고리 관리</span>
                </button>

                <button id="btn-sound-toggle" title="소리 설정" class="w-9 h-9 rounded-2xl bg-pink-100 hover:bg-pink-200 text-pink-600 flex items-center justify-center transition-all border border-pink-200">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-xs"></i>
                </button>
            </div>

        </div>
    </header>

    <!-- Main Content Body -->
    <main class="relative z-10 max-w-4xl mx-auto px-4 py-4 flex-1 w-full flex flex-col gap-5">

        <!-- Selector Box -->
        <section class="glass-card rounded-3xl p-5 shadow-soft-pink transition-all">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3">
                <div class="flex items-center gap-2">
                    <span class="text-sm text-pink-600 font-bold">연습 모드</span>
                    <div class="inline-flex p-1 bg-pink-100/70 rounded-2xl border border-pink-200/60" id="mode-buttons">
                        <button data-mode="preset" class="px-4 py-1 text-xs sm:text-sm font-bold rounded-xl bg-white text-pink-600 shadow-sm transition-all">카테고리 선택</button>
                        <button data-mode="custom" class="px-4 py-1 text-xs sm:text-sm font-bold rounded-xl text-pink-400 hover:text-pink-600 transition-all">직접 입력</button>
                    </div>
                </div>

                <button id="btn-restart" class="px-4 py-1.5 text-xs sm:text-sm font-bold text-pink-600 bg-pink-100/80 hover:bg-pink-200 rounded-2xl border border-pink-200 flex items-center gap-1.5 shadow-sm active:scale-95 transition-all">
                    <i class="fa-solid fa-rotate-right"></i> 다시 시작 (ESC)
                </button>
            </div>

            <!-- Preset Controls -->
            <div id="section-preset" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-bold text-pink-400 mb-1">카테고리</label>
                    <select id="preset-category" class="w-full bg-white/90 border-2 border-pink-200 rounded-2xl px-3 py-2 text-xs sm:text-sm font-sans text-slate-700 focus:outline-none focus:border-pink-400 transition-all shadow-inner-pink">
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-pink-400 mb-1">문장 선택</label>
                    <select id="preset-item" class="w-full bg-white/90 border-2 border-pink-200 rounded-2xl px-3 py-2 text-xs sm:text-sm font-sans text-slate-700 focus:outline-none focus:border-pink-400 transition-all shadow-inner-pink">
                    </select>
                </div>
            </div>

            <!-- Custom Input Controls -->
            <div id="section-custom" class="hidden flex-col gap-2">
                <label class="block text-xs font-bold text-pink-400">연습할 텍스트 입력</label>
                <textarea id="custom-text-input" rows="3" placeholder="연습하고 싶은 문장을 입력하세요." class="w-full p-3.5 bg-white/90 border-2 border-pink-200 rounded-2xl text-xs sm:text-sm font-sans focus:outline-none focus:border-pink-400 transition-all shadow-inner-pink resize-y"></textarea>
                <div class="flex justify-end">
                    <button id="btn-apply-custom" class="px-5 py-2 bg-gradient-to-r from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white rounded-2xl text-xs sm:text-sm font-bold shadow-md shadow-pink-200 transition-all flex items-center gap-1.5">
                        연습 시작
                    </button>
                </div>
            </div>
        </section>

        <!-- Main Typing Area Container -->
        <section class="glass-card rounded-3xl p-6 sm:p-8 shadow-soft-pink flex flex-col gap-5 relative border-4 border-white">
            
            <div id="focus-overlay" class="absolute inset-0 bg-pink-100/30 backdrop-blur-[3px] rounded-3xl z-20 flex items-center justify-center cursor-pointer transition-opacity">
                <div class="bg-white/95 border-2 border-pink-300 px-6 py-3.5 rounded-3xl shadow-xl flex items-center gap-3 text-pink-600 font-bold text-base sm:text-lg">
                    <span>클릭하여 연습을 시작하세요</span>
                </div>
            </div>

            <div id="typing-display-container" class="min-h-[160px] max-h-[260px] overflow-y-auto p-5 sm:p-6 bg-white/80 border-2 border-pink-200 rounded-2xl font-mono text-lg sm:text-xl leading-relaxed tracking-wide select-none break-words whitespace-pre-wrap shadow-inner-pink">
                <div id="typing-display" class="w-full"></div>
            </div>

            <input type="text" id="hidden-input" class="sr-only" autocomplete="off" capitalize="off" spellcheck="false">

            <!-- Progress Bar -->
            <div class="space-y-1">
                <div class="flex justify-between items-center text-xs font-bold text-pink-400">
                    <span>진행률</span>
                    <span id="detail-progress" class="font-mono text-pink-600 text-sm">0%</span>
                </div>
                <div class="w-full bg-pink-100/80 rounded-full h-3.5 p-0.5 border border-pink-200 relative overflow-hidden shadow-inner">
                    <div id="progress-bar" class="bg-gradient-to-r from-pink-300 via-pink-400 to-pink-500 h-full rounded-full w-0 transition-all duration-200"></div>
                </div>
            </div>
        </section>

        <!-- Stats Grid -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="glass-card p-4 rounded-3xl shadow-sm border border-pink-100 flex flex-col justify-between hover:scale-[1.02] transition-transform">
                <span class="text-xs text-pink-400 font-bold">경과 시간</span>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="detail-time" class="text-2xl font-bold font-mono text-pink-600">00:00</span>
                    <i class="fa-solid fa-stopwatch text-pink-200 text-lg"></i>
                </div>
            </div>

            <div class="glass-card p-4 rounded-3xl shadow-sm border border-pink-100 flex flex-col justify-between hover:scale-[1.02] transition-transform">
                <span class="text-xs text-pink-400 font-bold">WPM (단어/분)</span>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="detail-wpm" class="text-2xl font-bold font-mono text-pink-600">0</span>
                    <i class="fa-solid fa-feather-pointed text-pink-200 text-lg"></i>
                </div>
            </div>

            <div class="glass-card p-4 rounded-3xl shadow-sm border border-pink-100 flex flex-col justify-between hover:scale-[1.02] transition-transform">
                <span class="text-xs text-pink-400 font-bold">오타 수</span>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="detail-errors" class="text-2xl font-bold font-mono text-rose-400">0</span>
                    <i class="fa-solid fa-heart-crack text-rose-200 text-lg"></i>
                </div>
            </div>

            <div class="glass-card p-4 rounded-3xl shadow-sm border border-pink-100 flex flex-col justify-between hover:scale-[1.02] transition-transform">
                <span class="text-xs text-pink-400 font-bold">입력 글자 수</span>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="detail-chars" class="text-xl font-bold font-mono text-pink-600">0 / 0</span>
                    <i class="fa-solid fa-pen-nib text-pink-200 text-lg"></i>
                </div>
            </div>
        </section>

    </main>

    <footer class="relative z-10 py-4 text-center text-xs text-pink-400 font-medium">
        Typing Practice
    </footer>

    <!-- Category Manager Modal -->
    <div id="category-modal" class="fixed inset-0 bg-pink-950/30 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border-2 border-pink-200 transform scale-95 transition-all duration-300 relative flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center pb-3 border-b border-pink-100 mb-4">
                <h3 class="text-lg font-bold text-pink-600 flex items-center gap-2">
                    <span>📂</span> 카테고리 관리
                </h3>
                <button id="btn-close-category-modal" class="text-pink-300 hover:text-pink-600 text-xl font-bold">
                    &times;
                </button>
            </div>

            <div class="overflow-y-auto space-y-5 pr-1 flex-1">
                <div class="bg-pink-50/70 p-4 rounded-2xl border border-pink-100 space-y-3">
                    <h4 class="text-xs font-bold text-pink-600">새 카테고리 추가</h4>
                    <div>
                        <input type="text" id="new-cat-title" placeholder="카테고리 제목" class="w-full px-3 py-2 bg-white border border-pink-200 rounded-xl text-xs font-sans focus:outline-none focus:border-pink-400">
                    </div>
                    <div>
                        <textarea id="new-cat-sentences" rows="3" placeholder="연습 문장 입력 (줄바꿈으로 구분)" class="w-full px-3 py-2 bg-white border border-pink-200 rounded-xl text-xs font-sans focus:outline-none focus:border-pink-400"></textarea>
                    </div>
                    <button id="btn-add-category" class="w-full py-2 bg-pink-500 hover:bg-pink-600 text-white rounded-xl text-xs font-bold shadow-sm transition-all">
                        카테고리 저장
                    </button>
                </div>

                <div>
                    <h4 class="text-xs font-bold text-pink-400 mb-2">등록된 카테고리</h4>
                    <div id="custom-category-list" class="space-y-2">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-pink-950/30 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border-4 border-pink-200 transform scale-90 transition-all duration-300 text-center relative overflow-hidden" id="result-card">
            
            <div class="w-20 h-20 bg-gradient-to-tr from-pink-300 to-pink-400 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-3 shadow-lg shadow-pink-200 animate-bounce">
                🎉
            </div>

            <h2 class="text-2xl font-bold text-pink-600 mb-1">연습 완료!</h2>
            <p class="text-xs text-pink-400 mb-6 font-sans">결과 기록입니다.</p>

            <div class="grid grid-cols-2 gap-3 mb-6 font-mono">
                <div class="bg-pink-50 p-3 rounded-2xl border border-pink-100">
                    <span class="text-xs font-sans text-pink-400 block mb-1">타수 (CPM)</span>
                    <span id="result-cpm" class="text-2xl font-bold text-pink-600">0</span>
                </div>
                <div class="bg-pink-50 p-3 rounded-2xl border border-pink-100">
                    <span class="text-xs font-sans text-pink-400 block mb-1">단어속도 (WPM)</span>
                    <span id="result-wpm" class="text-2xl font-bold text-pink-500">0</span>
                </div>
                <div class="bg-pink-50 p-3 rounded-2xl border border-pink-100">
                    <span class="text-xs font-sans text-pink-400 block mb-1">정확도</span>
                    <span id="result-accuracy" class="text-2xl font-bold text-lavender-500">0%</span>
                </div>
                <div class="bg-pink-50 p-3 rounded-2xl border border-pink-100">
                    <span class="text-xs font-sans text-pink-400 block mb-1">소요 시간</span>
                    <span id="result-time" class="text-2xl font-bold text-slate-700">00:00</span>
                </div>
            </div>

            <button id="btn-modal-retry" class="w-full py-3.5 bg-gradient-to-r from-pink-400 via-pink-500 to-pink-600 hover:from-pink-500 hover:to-pink-700 text-white font-bold text-lg rounded-2xl shadow-lg shadow-pink-200 transition-all flex items-center justify-center gap-2 active:scale-95">
                다시 도전하기
            </button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const DEFAULT_PRESETS = {
            'korean-sentences': {
                name: "한글 짧은 글 모음",
                custom: false,
                items: [
                    "천 리 길도 한 걸음부터 시작한다는 사실을 기억하세요.",
                    "오늘의 작은 노력이 내일의 큰 결실을 맺게 됩니다.",
                    "시작이 반이라는 말처럼 망설이지 말고 도전해보세요.",
                    "바람이 불지 않을 때 노를 저어라."
                ]
            },
            'english-quotes': {
                name: "English Quotes",
                custom: false,
                items: [
                    "You are capable of amazing things.",
                    "Keep your face always toward the sunshine.",
                    "Happiness blooms from within.",
                    "Small steps every day lead to big results."
                ]
            }
        };

        let categories = {};

        function loadCategories() {
            const saved = localStorage.getItem('pink_typing_categories');
            if (saved) {
                try {
                    categories = JSON.parse(saved);
                } catch(e) {
                    categories = { ...DEFAULT_PRESETS };
                }
            } else {
                categories = { ...DEFAULT_PRESETS };
            }
        }

        function saveCategories() {
            localStorage.setItem('pink_typing_categories', JSON.stringify(categories));
        }

        let soundEnabled = true;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playKeySound(isError = false) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (isError) {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.12);
                } else {
                    osc.type = 'sine';
                    const pitch = 440 + Math.random() * 100; 
                    osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.06);
                }
            } catch (e) {}
        }

        let targetText = "";
        let typedText = "";
        let startTime = null;
        let timerInterval = null;
        let isCompleted = false;
        let errorCount = 0;
        let lastLength = 0;

        const displayContainer = document.getElementById('typing-display-container');
        const typingDisplay = document.getElementById('typing-display');
        const hiddenInput = document.getElementById('hidden-input');
        const focusOverlay = document.getElementById('focus-overlay');
        
        const statTime = document.getElementById('stat-time');
        const statCpm = document.getElementById('stat-cpm');
        const statAccuracy = document.getElementById('stat-accuracy');
        const progressBar = document.getElementById('progress-bar');

        const detailTime = document.getElementById('detail-time');
        const detailProgress = document.getElementById('detail-progress');
        const detailWpm = document.getElementById('detail-wpm');
        const detailErrors = document.getElementById('detail-errors');
        const detailChars = document.getElementById('detail-chars');

        const presetCategory = document.getElementById('preset-category');
        const presetItem = document.getElementById('preset-item');
        const modeButtons = document.getElementById('mode-buttons');
        const sectionPreset = document.getElementById('section-preset');
        const sectionCustom = document.getElementById('section-custom');
        const customTextInput = document.getElementById('custom-text-input');
        const btnApplyCustom = document.getElementById('btn-apply-custom');
        const btnRestart = document.getElementById('btn-restart');
        const btnSoundToggle = document.getElementById('btn-sound-toggle');
        const soundIcon = document.getElementById('sound-icon');

        const categoryModal = document.getElementById('category-modal');
        const btnOpenCatModal = document.getElementById('btn-open-category-modal');
        const btnCloseCatModal = document.getElementById('btn-close-category-modal');
        const btnAddCategory = document.getElementById('btn-add-category');
        const newCatTitle = document.getElementById('new-cat-title');
        const newCatSentences = document.getElementById('new-cat-sentences');
        const customCategoryList = document.getElementById('custom-category-list');

        const resultModal = document.getElementById('result-modal');
        const resultCard = document.getElementById('result-card');
        const btnModalRetry = document.getElementById('btn-modal-retry');

        function init() {
            loadCategories();
            populateCategoriesSelect();
            populatePresetItems();
            if (presetItem.value) {
                setTargetText(presetItem.value);
            }
            setupEventListeners();
        }

        function populateCategoriesSelect() {
            presetCategory.innerHTML = Object.keys(categories).map(key => 
                `<option value="${key}">${escapeHtml(categories[key].name)}</option>`
            ).join('');
        }

        function populatePresetItems() {
            const catKey = presetCategory.value;
            const catObj = categories[catKey];
            const items = catObj ? catObj.items : [];
            presetItem.innerHTML = items.map((text, idx) => 
                `<option value="${escapeHtml(text)}">${idx + 1}. ${escapeHtml(text.substring(0, 32))}${text.length > 32 ? '...' : ''}</option>`
            ).join('');
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function setupEventListeners() {
            presetCategory.addEventListener('change', () => {
                populatePresetItems();
                resetPractice();
            });

            presetItem.addEventListener('change', () => {
                resetPractice();
            });

            btnSoundToggle.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                if (soundEnabled) {
                    soundIcon.className = "fa-solid fa-volume-high text-xs";
                    btnSoundToggle.classList.replace('bg-slate-200', 'bg-pink-100');
                } else {
                    soundIcon.className = "fa-solid fa-volume-xmark text-xs";
                    btnSoundToggle.classList.replace('bg-pink-100', 'bg-slate-200');
                }
            });

            modeButtons.addEventListener('click', (e) => {
                const button = e.target.closest('button');
                if (!button) return;

                const mode = button.dataset.mode;
                Array.from(modeButtons.children).forEach(btn => {
                    btn.classList.remove('bg-white', 'shadow-sm', 'text-pink-600');
                    btn.classList.add('text-pink-400');
                });
                button.classList.add('bg-white', 'shadow-sm', 'text-pink-600');
                button.classList.remove('text-pink-400');

                if (mode === 'preset') {
                    sectionPreset.classList.remove('hidden');
                    sectionCustom.classList.add('hidden');
                    if (presetItem.value) setTargetText(presetItem.value);
                } else {
                    sectionPreset.classList.add('hidden');
                    sectionCustom.classList.remove('hidden');
                    if (customTextInput.value.trim()) {
                        setTargetText(customTextInput.value.trim());
                    }
                }
                resetPractice();
            });

            btnApplyCustom.addEventListener('click', () => {
                const text = customTextInput.value.trim();
                if (text) {
                    setTargetText(text);
                    resetPractice();
                }
            });

            displayContainer.addEventListener('click', focusInput);
            focusOverlay.addEventListener('click', focusInput);
            hiddenInput.addEventListener('focus', () => focusOverlay.classList.add('opacity-0', 'pointer-events-none'));
            hiddenInput.addEventListener('blur', () => {
                if (!isCompleted) focusOverlay.classList.remove('opacity-0', 'pointer-events-none');
            });

            hiddenInput.addEventListener('input', handleInput);

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') resetPractice();
            });

            btnRestart.addEventListener('click', resetPractice);
            btnModalRetry.addEventListener('click', () => {
                hideModal();
                resetPractice();
            });

            btnOpenCatModal.addEventListener('click', () => {
                renderCategoryManagementList();
                categoryModal.classList.remove('opacity-0', 'pointer-events-none');
                categoryModal.firstElementChild.classList.remove('scale-95');
                categoryModal.firstElementChild.classList.add('scale-100');
            });

            btnCloseCatModal.addEventListener('click', closeCategoryModal);

            btnAddCategory.addEventListener('click', () => {
                const title = newCatTitle.value.trim();
                const rawSentences = newCatSentences.value.trim();
                if (!title || !rawSentences) return;

                const sentenceList = rawSentences.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                if (sentenceList.length === 0) return;

                const newKey = 'custom-' + Date.now();
                categories[newKey] = {
                    name: title,
                    custom: true,
                    items: sentenceList
                };

                saveCategories();
                populateCategoriesSelect();
                presetCategory.value = newKey;
                populatePresetItems();

                newCatTitle.value = '';
                newCatSentences.value = '';

                renderCategoryManagementList();
                resetPractice();
            });
        }

        function closeCategoryModal() {
            categoryModal.classList.add('opacity-0', 'pointer-events-none');
            categoryModal.firstElementChild.classList.remove('scale-100');
            categoryModal.firstElementChild.classList.add('scale-95');
        }

        function renderCategoryManagementList() {
            customCategoryList.innerHTML = Object.keys(categories).map(key => {
                const cat = categories[key];
                return `
                    <div class="flex items-center justify-between p-3 bg-white border border-pink-100 rounded-xl shadow-sm">
                        <div>
                            <span class="text-xs font-bold text-pink-600 block">${escapeHtml(cat.name)}</span>
                            <span class="text-[11px] text-pink-300 font-sans">${cat.items.length}개의 문장</span>
                        </div>
                        ${cat.custom ? `
                            <button onclick="deleteCategory('${key}')" class="text-rose-400 hover:text-rose-600 text-xs px-2 py-1 rounded bg-rose-50 border border-rose-100">
                                <i class="fa-solid fa-trash-can"></i> 삭제
                            </button>
                        ` : '<span class="text-[10px] text-pink-300 bg-pink-50 px-2 py-0.5 rounded">기본</span>'}
                    </div>
                `;
            }).join('');
        }

        window.deleteCategory = function(key) {
            if (categories[key] && categories[key].custom) {
                delete categories[key];
                saveCategories();
                populateCategoriesSelect();
                populatePresetItems();
                renderCategoryManagementList();
                resetPractice();
            }
        };

        function focusInput() {
            if (isCompleted) return;
            hiddenInput.focus();
        }

        function setTargetText(text) {
            targetText = text;
            renderDisplay();
        }

        function resetPractice() {
            clearInterval(timerInterval);
            timerInterval = null;
            startTime = null;
            typedText = "";
            hiddenInput.value = "";
            isCompleted = false;
            errorCount = 0;
            lastLength = 0;

            const isPresetMode = modeButtons.querySelector('[data-mode="preset"]').classList.contains('bg-white');
            if (isPresetMode) {
                if (presetItem.value) targetText = presetItem.value;
            } else if (customTextInput.value.trim()) {
                targetText = customTextInput.value.trim();
            }

            renderDisplay();
            updateStats(0, 0, 100);

            progressBar.style.width = '0%';
            detailProgress.textContent = '0%';
            detailWpm.textContent = '0';
            detailErrors.textContent = '0';
            detailChars.textContent = `0 / ${targetText.length}`;

            focusInput();
        }

        function handleInput(e) {
            if (isCompleted) return;

            const inputVal = hiddenInput.value;

            if (inputVal.length > lastLength) {
                const currentTypedChar = inputVal[inputVal.length - 1];
                const expectedChar = targetText[inputVal.length - 1];
                playKeySound(currentTypedChar !== expectedChar);
            }
            lastLength = inputVal.length;

            if (!startTime && inputVal.length > 0) {
                startTime = new Date();
                timerInterval = setInterval(updateTimer, 100);
            }

            typedText = inputVal;

            let currentErrors = 0;
            for (let i = 0; i < typedText.length; i++) {
                if (typedText[i] !== targetText[i]) {
                    currentErrors++;
                }
            }
            errorCount = currentErrors;

            renderDisplay();
            calculateAndDisplayStats();

            if (typedText.length >= targetText.length) {
                completePractice();
            }
        }

        function renderDisplay() {
            let html = "";
            const currentIdx = typedText.length;

            for (let i = 0; i < targetText.length; i++) {
                const char = targetText[i];
                const isSpace = char === ' ';

                if (i < currentIdx) {
                    if (typedText[i] === char) {
                        html += `<span class="char-box text-pink-600 bg-pink-100/90">${isSpace ? '&nbsp;' : escapeHtml(char)}</span>`;
                    } else {
                        html += `<span class="char-box text-rose-600 bg-rose-200/90 font-bold underline underline-offset-2 decoration-rose-500">${isSpace ? '&nbsp;' : escapeHtml(char)}</span>`;
                    }
                } else if (i === currentIdx) {
                    html += `<span class="char-box caret-pink">${isSpace ? '&nbsp;' : escapeHtml(char)}</span>`;
                } else {
                    html += `<span class="char-box text-pink-300/80">${isSpace ? '&nbsp;' : escapeHtml(char)}</span>`;
                }
            }

            typingDisplay.innerHTML = html;

            const activeElem = typingDisplay.children[currentIdx];
            if (activeElem) {
                activeElem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function updateTimer() {
            if (!startTime) return;
            calculateAndDisplayStats();
        }

        function calculateAndDisplayStats() {
            if (!startTime) return;

            const now = new Date();
            const elapsedSeconds = Math.max((now - startTime) / 1000, 0.1);

            const typedChars = typedText.length;
            const cpm = Math.round((typedChars / elapsedSeconds) * 60);
            const wpm = Math.round((typedChars / 5) / (elapsedSeconds / 60));

            let accuracy = 100;
            if (typedChars > 0) {
                const correctChars = typedChars - errorCount;
                accuracy = Math.max(0, Math.round((correctChars / typedChars) * 100));
            }

            const progress = Math.min(100, Math.round((typedChars / targetText.length) * 100));

            updateStats(elapsedSeconds, cpm, accuracy, wpm, progress, typedChars);
        }

        function updateStats(seconds, cpm, accuracy, wpm = 0, progress = 0, typedChars = 0) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            const timeStr = `${mins}:${secs}`;

            statTime.textContent = timeStr;
            detailTime.textContent = timeStr;

            statCpm.textContent = `${cpm} CPM`;
            statAccuracy.textContent = `${accuracy}%`;

            progressBar.style.width = `${progress}%`;
            detailProgress.textContent = `${progress}%`;
            detailWpm.textContent = `${wpm}`;
            detailErrors.textContent = `${errorCount}`;
            detailChars.textContent = `${typedChars} / ${targetText.length}`;
        }

        function completePractice() {
            isCompleted = true;
            clearInterval(timerInterval);
            hiddenInput.blur();

            const now = new Date();
            const elapsedSeconds = Math.max((now - startTime) / 1000, 0.1);
            const cpm = Math.round((typedText.length / elapsedSeconds) * 60);
            const wpm = Math.round((typedText.length / 5) / (elapsedSeconds / 60));
            
            const correctChars = typedText.length - errorCount;
            const accuracy = Math.max(0, Math.round((correctChars / typedText.length) * 100));

            const mins = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
            const secs = Math.floor(elapsedSeconds % 60).toString().padStart(2, '0');

            document.getElementById('result-cpm').textContent = cpm;
            document.getElementById('result-wpm').textContent = wpm;
            document.getElementById('result-accuracy').textContent = `${accuracy}%`;
            document.getElementById('result-time').textContent = `${mins}:${secs}`;

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#FF69B4', '#FFB6C1', '#FFE4E1', '#E9D5FF', '#FFF0F5']
                });
            }

            showModal();
        }

        function showModal() {
            resultModal.classList.remove('opacity-0', 'pointer-events-none');
            resultCard.classList.remove('scale-90');
            resultCard.classList.add('scale-100');
        }

        function hideModal() {
            resultModal.classList.add('opacity-0', 'pointer-events-none');
            resultCard.classList.remove('scale-100');
            resultCard.classList.add('scale-90');
        }

        window.onload = init;
    </script>
</body>
</html>
