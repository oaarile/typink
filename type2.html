<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타자 연습 프로그램</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --bg-color: #FFF0F5;
            --card-bg: #FFFFFF;
            --primary: #FFB6C1;
            --primary-dark: #FF69B4;
            --accent: #DB7093;
            --text-main: #4A4A4A;
            --text-sub: #7A7A7A;
            --correct-bg: #E8F5E9;
            --correct-text: #2E7D32;
            --incorrect-bg: #FFEBEE;
            --incorrect-text: #C62828;
            --active-bg: #FFF0F5;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #FFE4E1;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .header-btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #FFFAFB;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #FFE4E1;
        }

        select {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--primary);
            outline: none;
            color: var(--text-main);
            font-size: 14px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            text-align: center;
        }

        .stat-item {
            background: #FFF;
            border: 1px solid #FFE4E1;
            padding: 12px;
            border-radius: 12px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .typing-area {
            position: relative;
            background: #FAFAFA;
            border: 2px solid #FFE4E1;
            border-radius: 12px;
            padding: 24px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 20px;
            line-height: 1.6;
            letter-spacing: 1px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            cursor: text;
        }

        .char-box {
            display: inline-block;
            position: relative;
            min-width: 12px;
            text-align: center;
            border-bottom: 2px solid transparent;
            color: #A0A0A0;
        }

        .char-box.current {
            border-bottom: 2px solid var(--primary-dark);
            background-color: var(--active-bg);
            color: #333;
        }

        .char-box.correct {
            color: var(--correct-text);
            background-color: var(--correct-bg);
        }

        .char-box.incorrect {
            color: var(--incorrect-text);
            background-color: var(--incorrect-bg);
        }

        .hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #FFE4E1;
            resize: none;
            outline: none;
            font-size: 14px;
        }

        .modal-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-secondary {
            background-color: #E0E0E0;
            color: #555;
        }

        .btn-secondary:hover {
            background-color: #D0D0D0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>타자 연습</h1>
        <div class="header-btn-group">
            <button id="manageCategoryBtn">📂 카테고리 관리</button>
        </div>
    </header>

    <div class="control-panel">
        <div>
            <label for="categorySelect">카테고리: </label>
            <select id="categorySelect"></select>
        </div>
        <button id="restartBtn">다시 시작</button>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-label">진행률</div>
            <div class="stat-value" id="progressVal">0%</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">현재 타수(CPM)</div>
            <div class="stat-value" id="cpmVal">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">정확도</div>
            <div class="stat-value" id="accVal">100%</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">시간</div>
            <div class="stat-value" id="timeVal">0s</div>
        </div>
    </div>

    <div class="typing-area" id="typingDisplay"></div>
    <input type="text" id="hiddenInput" class="hidden-input" autocomplete="off">
</div>

<!-- 카테고리 관리 모달 -->
<div class="modal" id="categoryModal">
    <div class="modal-content">
        <div class="modal-title">새 카테고리 추가</div>
        <input type="text" id="newCatTitle" placeholder="카테고리 이름" style="padding: 8px; border-radius: 8px; border: 1px solid #FFE4E1; outline: none;">
        <textarea id="newCatText" placeholder="문장들을 입력하세요 (줄바꿈으로 구분)"></textarea>
        <div class="modal-btn-group">
            <button class="btn-secondary" id="closeModalBtn">취소</button>
            <button id="saveCatBtn">저장</button>
        </div>
    </div>
</div>

<!-- 결과 모달 -->
<div class="modal" id="resultModal">
    <div class="modal-content" style="text-align: center;">
        <div class="modal-title">연습 완료!</div>
        <p id="resultSummary" style="margin: 15px 0; line-height: 1.6; color: var(--text-main);"></p>
        <button id="closeResultBtn" style="align-self: center;">확인</button>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const defaultCategories = {
            "한글 수필 (따뜻한 이야기)": [
                "햇살이 따스하게 내리쬐는 창가에 앉아 차 한 잔의 여유를 즐깁니다.",
                "바람에 흔들리는 나뭇잎 소리가 마음에 작은 평온을 가져다줍니다.",
                "소소한 일상 속에서 발견하는 작은 행복들이 삶을 더욱 풍요롭게 만듭니다.",
                "따뜻한 말 한마디는 추운 겨울날 감싸주는 포근한 겉옷과 같습니다."
            ],
            "영문 수필 (Heartwarming Prose)": [
                "Warmth is not just a temperature, but a feeling we share with others.",
                "A quiet afternoon with a cup of tea brings peace to the restless heart.",
                "Small acts of kindness can light up the darkest corners of a day.",
                "Nature whispers gentle stories to those who take the time to listen."
            ]
        };

        let categories = defaultCategories;
        try {
            const saved = localStorage.getItem('custom_typing_categories');
            if (saved) categories = JSON.parse(saved);
        } catch (e) {
            console.error(e);
        }

        let currentCategory = Object.keys(categories)[0];
        let currentSentenceIndex = 0;
        let targetText = "";
        let startTime = null;
        let timerInterval = null;
        let errorCount = 0;

        const categorySelect = document.getElementById('categorySelect');
        const typingDisplay = document.getElementById('typingDisplay');
        const hiddenInput = document.getElementById('hiddenInput');
        const progressVal = document.getElementById('progressVal');
        const cpmVal = document.getElementById('cpmVal');
        const accVal = document.getElementById('accVal');
        const timeVal = document.getElementById('timeVal');

        function updateCategoryDropdown() {
            categorySelect.innerHTML = '';
            Object.keys(categories).forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categorySelect.appendChild(opt);
            });
            categorySelect.value = currentCategory;
        }

        function initGame() {
            clearInterval(timerInterval);
            startTime = null;
            errorCount = 0;
            timeVal.textContent = '0s';
            cpmVal.textContent = '0';
            accVal.textContent = '100%';
            progressVal.textContent = '0%';
            
            const sentences = categories[currentCategory];
            if (!sentences || sentences.length === 0) {
                targetText = "문장이 없습니다.";
            } else {
                targetText = sentences[currentSentenceIndex % sentences.length];
            }

            typingDisplay.innerHTML = '';
            for (let i = 0; i < targetText.length; i++) {
                const span = document.createElement('span');
                span.className = 'char-box' + (i === 0 ? ' current' : '');
                span.textContent = targetText[i];
                typingDisplay.appendChild(span);
            }

            hiddenInput.value = '';
            hiddenInput.focus();
        }

        function updateStats(inputVal) {
            if (!startTime && inputVal.length > 0) {
                startTime = new Date();
                timerInterval = setInterval(() => {
                    const now = new Date();
                    const elapsed = Math.floor((now - startTime) / 1000);
                    timeVal.textContent = elapsed + 's';
                }, 1000);
            }

            const progress = Math.min(100, Math.floor((inputVal.length / targetText.length) * 100));
            progressVal.textContent = progress + '%';

            if (startTime) {
                const elapsedMinutes = (new Date() - startTime) / 60000;
                const cpm = elapsedMinutes > 0 ? Math.floor(inputVal.length / elapsedMinutes) : 0;
                cpmVal.textContent = cpm;
            }

            const accuracy = inputVal.length > 0 ? Math.max(0, Math.floor(((inputVal.length - errorCount) / inputVal.length) * 100)) : 100;
            accVal.textContent = accuracy + '%';
        }

        hiddenInput.addEventListener('input', () => {
            const inputVal = hiddenInput.value;
            const charSpans = typingDisplay.querySelectorAll('.char-box');
            
            errorCount = 0;
            for (let i = 0; i < targetText.length; i++) {
                const span = charSpans[i];
                const typedChar = inputVal[i];

                span.className = 'char-box';

                if (typedChar == null) {
                    if (i === inputVal.length) {
                        span.classList.add('current');
                    }
                } else if (typedChar === targetText[i]) {
                    span.classList.add('correct');
                } else {
                    span.classList.add('incorrect');
                    errorCount++;
                }
            }

            updateStats(inputVal);

            if (inputVal.length >= targetText.length) {
                clearInterval(timerInterval);
                setTimeout(() => {
                    document.getElementById('resultSummary').innerText = `최종 타수: ${cpmVal.textContent} CPM\n정확도: ${accVal.textContent}\n소요 시간: ${timeVal.textContent}`;
                    document.getElementById('resultModal').style.display = 'flex';
                }, 100);
            }
        });

        typingDisplay.addEventListener('click', () => hiddenInput.focus());

        categorySelect.addEventListener('change', (e) => {
            currentCategory = e.target.value;
            currentSentenceIndex = 0;
            initGame();
        });

        document.getElementById('restartBtn').addEventListener('click', initGame);

        const categoryModal = document.getElementById('categoryModal');
        document.getElementById('manageCategoryBtn').addEventListener('click', () => categoryModal.style.display = 'flex');
        document.getElementById('closeModalBtn').addEventListener('click', () => categoryModal.style.display = 'none');

        document.getElementById('saveCatBtn').addEventListener('click', () => {
            const title = document.getElementById('newCatTitle').value.trim();
            const text = document.getElementById('newCatText').value.trim();

            if (title && text) {
                const lines = text.split('\n').filter(line => line.trim() !== '');
                categories[title] = lines;
                try {
                    localStorage.setItem('custom_typing_categories', JSON.stringify(categories));
                } catch (e) {}
                currentCategory = title;
                updateCategoryDropdown();
                initGame();
                categoryModal.style.display = 'none';
                document.getElementById('newCatTitle').value = '';
                document.getElementById('newCatText').value = '';
            }
        });

        document.getElementById('closeResultBtn').addEventListener('click', () => {
            document.getElementById('resultModal').style.display = 'none';
            currentSentenceIndex++;
            initGame();
        });

        updateCategoryDropdown();
        initGame();
    });
</script>

</body>
</html>
